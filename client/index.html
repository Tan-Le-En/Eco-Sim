<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECO//SIM — A Field Study of a Coastal Town, 2026–2050</title>
    <meta
      name="description"
      content="An interactive field study of Teluk Nusa, a fictional Malaysian coastal town, 2026–2050. Change one thing, watch everything change. Simple enough for a child; rigorous enough for a professor."

    <meta name="color-scheme" content="light dark" />

      media="(prefers-color-scheme: dark)"
      content="#1d1b18"
    />
    <link rel="canonical" href="https://ecosim2050.vercel.app/" />

    <!-- Static Open Graph / Twitter card: shared links resolve even for crawlers that never run JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ECO//SIM" />
    <meta
      property="og:title"
      content="ECO//SIM — A Field Study of a Coastal Town, 2026–2050"
    />
    <meta
      property="og:description"
      content="An interactive field study of Teluk Nusa, a fictional Malaysian coastal town. Change one thing, watch everything change."
    />
    <meta property="og:url" content="https://ecosim2050.vercel.app/" />
    <meta
      property="og:image"
      content="https://ecosim2050.vercel.app/storage/og-image_475a5541.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ECO//SIM — A Field Study of a Coastal Town, 2026–2050"
    />
    <meta
      name="twitter:description"
      content="An interactive field study of Teluk Nusa, a fictional Malaysian coastal town. Change one thing, watch everything change."

      name="twitter:image"
      content="https://ecosim2050.vercel.app/storage/og-image_475a5541.jpg"

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231C1A16'/%3E%3Ctext x='4' y='23' font-family='Georgia,serif' font-size='17' fill='%23F4F1EA'%3EE%3C/text%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='17' fill='%23C84A2E'%3E//%3C/text%3E%3C/svg%3E"
    />

    <!-- Pre-paint theme: mirrors ThemeContext so dark mode never flashes on reload. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* theme stays light */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/storage/kuala-kedah-hd_dfd13b90.jpg"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  <body>

  </body>
